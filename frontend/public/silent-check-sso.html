<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Silent Check SSO</title>
  </head>
  <body>
    <script>
      // Loaded in a hidden iframe by the Keycloak adapter to perform a silent SSO
      // check (onLoad: 'check-sso'). Keycloak redirects this iframe back to itself
      // with the auth response in the URL; relay that URL to the parent app window
      // so keycloak-js can complete the cookie-based login WITHOUT persisting any
      // tokens to web storage. This postMessage call is required — without it the
      // silent check never completes and the session cannot be restored on reload.
      parent.postMessage(location.href, location.origin)
    </script>
  </body>
</html>
