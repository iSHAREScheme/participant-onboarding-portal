version: '3.7'

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_SERVER_URL: ${NEXT_PUBLIC_BASE_SERVER_URL}
        NEXT_PUBLIC_KEYCLOAK_BASE_URL: ${NEXT_PUBLIC_KEYCLOAK_BASE_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
        NEXT_PUBLIC_ALWAYS_M2M: ${NEXT_PUBLIC_ALWAYS_M2M}
        NEXT_PUBLIC_ALWAYS_EHERKENNING: ${NEXT_PUBLIC_ALWAYS_EHERKENNING}
        NEXT_PUBLIC_PARTY_ID: ${NEXT_PUBLIC_PARTY_ID}
        NEXT_PUBLIC_PARTY_NAME: ${NEXT_PUBLIC_PARTY_NAME}
        NEXT_PUBLIC_PARTY_REGISTER_URL: ${NEXT_PUBLIC_PARTY_REGISTER_URL}
        NEXT_PUBLIC_PARTY_CAPABILITIES_URL: ${NEXT_PUBLIC_PARTY_CAPABILITIES_URL}
        NEXT_PUBLIC_DEFAULT_ASSOCIATION_NAME: ${NEXT_PUBLIC_DEFAULT_ASSOCIATION_NAME}
        NEXT_PUBLIC_SKIP_SETTINGS: ${NEXT_PUBLIC_SKIP_SETTINGS}
        NEXT_PUBLIC_SKIP_ROLES: ${NEXT_PUBLIC_SKIP_ROLES}
        NEXT_PUBLIC_ACTIVE_ROLES: ${NEXT_PUBLIC_ACTIVE_ROLES}
        NEXT_PUBLIC_DEFAULT_ROLE: ${NEXT_PUBLIC_DEFAULT_ROLE}
        NEXT_PUBLIC_AUTO_ACCEPT_PROPOSAL: ${NEXT_PUBLIC_AUTO_ACCEPT_PROPOSAL}
        NEXT_PUBLIC_STATIC_PARTY: ${NEXT_PUBLIC_STATIC_PARTY}
        NEXT_PUBLIC_DISABLE_ADMIN_ROUTES: ${NEXT_PUBLIC_DISABLE_ADMIN_ROUTES}
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - devnet
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    restart: always

  keycloak:
    build:
      context: ./keycloak
    container_name: keycloak
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KC_HOSTNAME: ${NEXT_PUBLIC_KEYCLOAK_BASE_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_CORS: true
      KC_HTTP_CORS_ORIGINS: ${NEXT_PUBLIC_FRONTEND_DOMAIN}
      KC_HTTP_CORS_METHODS: POST,GET,PUT,DELETE,OPTIONS
      KC_HTTP_CORS_HEADERS: Authorization,Content-Type
      KC_HTTP_CORS_ALLOW_CREDENTIALS: true
      KC_FEATURES: scripts,preview
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_IMPORT_STRATEGY: OVERWRITE_EXISTING
      KC_DEV_MASTER_SSL_REQUIRED: none
    command: >
      start-dev
    networks:
      - devnet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_DATABASE}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devnet
    restart: unless-stopped

networks:
  devnet:
    driver: bridge

volumes:
  keycloak_pg_data:
