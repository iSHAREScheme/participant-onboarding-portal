name: Bug report
description: Report a bug or regression
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug."
  - type: input
    id: version
    attributes:
      label: Version
      description: "Git tag, commit SHA, or docker image tag."
      placeholder: "v1.2.3"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Provide a minimal set of steps."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/screenshots
      description: "Include relevant logs or screenshots."
      render: shell
