# SonarCloud analysis scope tweaks (read by automatic analysis).
#
# Locale dictionaries are parallel translations of the same key structure;
# copy-paste detection flags en.ts vs nl.ts as duplication by construction.
sonar.cpd.exclusions=frontend/src/locales/**

# Automatic analysis ignores sonar.cpd.exclusions (only a property subset is
# honored) - fall back to excluding the locale dictionaries from analysis
# entirely: they are key->string tables with no logic, and their only findings
# were construction-inherent duplication between translations.
sonar.exclusions=frontend/src/locales/**
